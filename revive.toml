# revive rules for this repo — a focused, high-signal set (no style noise).
ignoreGeneratedHeader = false
severity = "warning"
confidence = 0.8
errorCode = 0
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.if-return]
[rule.indent-error-flow]
[rule.increment-decrement]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unreachable-code]
[rule.var-declaration]
[rule.var-naming]
